[project]
name = "major-league-gaming"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
]

[project.scripts]
mlg = "mlg.render:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["mlg", "assets", "sounds"]
exclude = ["assets/raw", "sounds/raw", "**/__pycache__"]

[tool.hatch.build.targets.wheel.sources]
"assets" = "mlg/assets"
"sounds" = "mlg/sounds"

[tool.hatch.build.targets.sdist]
only-include = ["mlg", "assets", "sounds", "README.md", "pyproject.toml", "uv.lock", "fetch_assets.sh"]
exclude = ["assets/raw", "sounds/raw", "**/__pycache__"]
